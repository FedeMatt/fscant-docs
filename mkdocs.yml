site_name: F-SCANT
site_description: Instruction manual for the F-SCANT computer software
site_url: https://FedeMatt.github.io/fscant-docs/
copyright: Copyright &copy; 2026 TB-ELECTRONICS

docs_dir: docs

theme:
  name: material
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - toc.follow

extra:
  generator: false
  alternate:
    - name: English
      link: /fscant-docs/
      lang: en

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - to-pdf:
      author: TB-ELECTRONICS GmbH
      cover_title: F-SCANT
      cover_subtitle: Instruction manual
      cover_logo: assets/logo.png
      output_path: pdf/fscant-user-guide.pdf
      enabled_if_env: ENABLE_PDF_EXPORT

nav:
  - Home: index.md
  - How to install F-SCANT: install.md
  - How to connect the F-SCAN: connect.md
  - Connect the F-SCAN on a Mac: connect-mac.md
  - How to create or import a DIRP: dirp.md
  - How to analyze a DIRP: analysis.md
  - How to manage users: users.md
  - Settings: settings.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
