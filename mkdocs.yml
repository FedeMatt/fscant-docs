site_name: F-SCANT
site_description: Instruction manual for the F-SCANT computer software
site_url: https://fscant-docs.fscan.com/
copyright: Copyright &copy; 2026 TB-ELECTRONICS

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.png
  favicon: assets/favicon.png
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.highlight
    - toc.follow
    - content.tooltips

extra:
  generator: false

extra_css:
  - stylesheets/extra.v5.css

plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: !ENV [EN_DEFAULT, true]
          name: English
          build: !ENV [BUILD_EN, true]
        - locale: it
          default: !ENV [IT_DEFAULT, false]
          name: Italiano
          build: !ENV [BUILD_IT, true]
          nav_translations:
            Home: Home
            How to install F-SCANT: Come installare F-SCANT
            How to connect the F-SCAN: Come collegare l'F-SCAN
            Connect the F-SCAN on a Mac: Collegare l'F-SCAN su Mac
            How to create or import a DIRP: Come creare o importare un DIRP
            How to analyze a DIRP: Come analizzare un DIRP
            How to manage users: Come gestire gli utenti
            Settings: Impostazioni
        - locale: de
          default: !ENV [DE_DEFAULT, false]
          name: Deutsch
          build: !ENV [BUILD_DE, true]
          nav_translations:
            Home: Start
            How to install F-SCANT: F-SCANT installieren
            How to connect the F-SCAN: F-SCAN verbinden
            Connect the F-SCAN on a Mac: F-SCAN auf einem Mac verbinden
            How to create or import a DIRP: DIRP erstellen oder importieren
            How to analyze a DIRP: DIRP analysieren
            How to manage users: Benutzer verwalten
            Settings: Einstellungen
        - locale: pl
          default: !ENV [PL_DEFAULT, false]
          name: Polski
          build: !ENV [BUILD_PL, true]
          nav_translations:
            Home: Start
            How to install F-SCANT: Jak zainstalować F-SCANT
            How to connect the F-SCAN: Jak podłączyć F-SCAN
            Connect the F-SCAN on a Mac: Podłączanie F-SCAN na Macu
            How to create or import a DIRP: Jak utworzyć lub importować DIRP
            How to analyze a DIRP: Jak analizować DIRP
            How to manage users: Jak zarządzać użytkownikami
            Settings: Ustawienia
        - locale: cs
          default: !ENV [CS_DEFAULT, false]
          name: Čeština
          build: !ENV [BUILD_CS, true]
          nav_translations:
            Home: Domů
            How to install F-SCANT: Jak nainstalovat F-SCANT
            How to connect the F-SCAN: Jak připojit F-SCAN
            Connect the F-SCAN on a Mac: Připojení F-SCAN na Macu
            How to create or import a DIRP: Jak vytvořit nebo importovat DIRP
            How to analyze a DIRP: Jak analyzovat DIRP
            How to manage users: Jak spravovat uživatele
            Settings: Nastavení
  - to-pdf:
      author: TB-ELECTRONICS GmbH
      cover_title: F-SCANT
      cover_subtitle: !ENV [PDF_COVER_SUBTITLE, "Instruction manual"]
      cover_logo: assets/logo.png
      output_path: !ENV [PDF_OUTPUT_PATH, "pdf/fscant-user-guide.pdf"]
      enabled_if_env: ENABLE_PDF_EXPORT

nav:
  - Home: index.md
  - How to install F-SCANT: install.md
  - How to connect the F-SCAN: connect.md
  - Connect the F-SCAN on a Mac: connect-mac.md
  - How to create or import a DIRP: dirp.md
  - How to analyze a DIRP: analysis.md
  - How to manage users: users.md
  - Settings: settings.md

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
